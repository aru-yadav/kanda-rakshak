; Kanda Rakshak firmware — ESP32 DevKit V1 (ESP32-WROOM-32)
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -Wall
